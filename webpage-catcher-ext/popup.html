<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; }
  body {
    width: 300px;
    margin: 0;
    padding: 14px;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    background: #f6f8fb;
    color: #1f2937;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.18); }
  button {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    margin-bottom: 10px;
    border: 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { filter: brightness(.92); }
  #shot { background: #2563eb; color: #fff; }
  #pdf { background: #0ea5e9; color: #fff; }
  button:disabled { opacity: .5; cursor: wait; }
  #status {
    min-height: 34px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #eef2f7;
    font-size: 12px;
    line-height: 1.5;
    word-break: break-all;
  }
  #status.err { background: #fee2e2; color: #b91c1c; }
  #status.ok  { background: #dcfce7; color: #15803d; }
  .tip { margin-top: 10px; font-size: 11px; color: #6b7280; line-height: 1.6; }
</style>
</head>
<body>
  <h1><span class="dot"></span>网页长截图 &amp; PDF</h1>
  <button id="shot">📷 整页长截图（PNG）</button>
  <button id="pdf">📄 导出 PDF</button>
  <div id="status">就绪。点击按钮对当前标签页操作。</div>
  <div class="tip">弹出"正在调试此浏览器"提示条属正常现象，操作完成后自动消失。全程本地处理，无任何联网。</div>
  <script src="popup.js"></script>
</body>
</html>
